<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contrato – VOALÁ! BUFFET</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PAINEL DE CAMPOS -->
  <div id="painel">
    <h2>Dados do Contrato</h2>

    <label>Título / Nome do Contrato</label>
    <input id="tituloContrato" type="text" value="Contrato de Prestação de Serviço de Buffet" />

    <label>Nome do(a) Contratante</label>
    <input id="nomeContratante" type="text" value="Jessica Coelho Pacheco" />

    <label>CPF do(a) Contratante</label>
    <input id="cpfContratante" type="text" value="933.236.972-00" />

    <label>Endereço do(a) Contratante</label>
    <input id="endContratante" type="text"
           value="Rua Boacha, nº 19A, Novo Aleixo, Manaus/AM" />

    <label>Nome da Contratada (responsável)</label>
    <input id="nomeContratada" type="text" value="Paulo Roberto Xavier Júnior" />

    <label>CPF da Contratada</label>
    <input id="cpfContratada" type="text" value="060.610.385-40" />

    <label>Endereço da Contratada</label>
    <input id="endContratada" type="text"
           value="Rua Jaguaquara, nº 391, Alvorada, Manaus/AM" />

    <label>Data do Evento</label>
    <input id="dataEvento" type="text" value="25/07/2026" />

    <label>Horário do Evento</label>
    <input id="horaEvento" type="text" value="19h" />

    <label>Local do Evento</label>
    <input id="localEvento" type="text" value="Village Festas" />

    <label>Número de Convidados</label>
    <input id="numConvidados" type="text" value="150 adultos" />

    <label>Tipo de Serviço</label>
    <input id="tipoServico" type="text" value="Buffet de crepe francês" />

    <label>Valor Total (R$)</label>
    <input id="valorTotal" type="text" value="3.700,00" />

    <label>Valor Total por Extenso</label>
    <input id="valorExtenso" type="text"
           value="três mil e setecentos reais" />

    <label>Hora extra (R$ por funcionário)</label>
    <input id="horaExtra" type="text" value="30,00" />

    <label>Preço Taça (R$)</label>
    <input id="precoTaça" type="text" value="10,00" />

    <label>Preço Prato (R$)</label>
    <input id="precoPrato" type="text" value="15,00" />

    <label>Preço Talher (R$)</label>
    <input id="precoTalher" type="text" value="7,00" />

    <label>Cidade/Comarca</label>
    <input id="cidade" type="text" value="Manaus" />

    <label>Data de Assinatura (texto)</label>
    <input id="dataAssinatura" type="text" value="08 de maio de 2026" />

    <button onclick="gerarContrato()">Visualizar Contrato</button>
    <button onclick="gerarPDF()">Gerar PDF</button>
  </div>

  <!-- PREVIEW DO CONTRATO (UMA COLUNA) -->
  <div id="contrato">
    <div id="conteudo">
      <!-- O JS injeta o contrato aqui -->
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="contrato.js"></script>
</body>
</html>
