<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitor Amaral - Consultor de Vendas Energia Solar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            text-align: center;
            padding-bottom: 24px;
        }
        .banner-img {
            width: 100%;
            height: auto;
            display: block;
        }
        .content {
            padding: 20px 20px 0 20px;
        }
        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #25D366;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            padding: 16px 28px;
            border-radius: 50px;
            margin-top: 16px;
            width: 90%;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        .btn-whatsapp:hover {
            background-color: #1ebc57;
            transform: translateY(-2px);
        }
        .btn-whatsapp:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Foto centralizada do repositório -->
        <img src="IMG-20261018-WA0002.jpg" alt="Vitor Amaral - Fácill Energia Solar" class="banner-img">

        <div class="content">
            <!-- Botão com link direto para o WhatsApp -->
            <a href="https://wa.me/5592982674019?text=Ol%C3%A1!%20Quero%20saber%20mais%20sobre%20instala%C3%A7%C3%A3o%20de%20pain%C3%A9is%20solares." target="_blank" class="btn-whatsapp">
                Saiba Mais
            </a>
        </div>
    </div>

</body>
</html>
